name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write public Supabase browser configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          # The site key is public. Keep the repository fallback so a missing
          # Actions variable cannot silently deploy a broken OTP form.
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || '0x4AAAAAAFaA7kJaQr3AQBGg' }}
        run: |
          cat > frontend/supabase-config.js <<EOF
          // Generated during deployment from GitHub Actions Variables.
          window.SUPABASE_URL = "${SUPABASE_URL}";
          window.SUPABASE_PUBLISHABLE_KEY = "${SUPABASE_PUBLISHABLE_KEY}";
          // Cloudflare Turnstile Site Key (public, browser-safe).
          window.TURNSTILE_SITE_KEY = "${TURNSTILE_SITE_KEY}";
          EOF
          # Ensure browsers and the Pages CDN fetch the generated public config
          # again after every deployment.
          sed -i "s|supabase-config.js|supabase-config.js?v=${GITHUB_SHA}|g" frontend/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
