<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f17" />
  <link rel="icon" type="image/png" href="/favicon.png?v=2" />
  <title>Sign in · AI Crypto Trader C4C</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/config.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js" defer></script>
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <header class="login-header">
    <a class="login-brand" href="/" aria-label="AI Crypto Trader home">
      <img class="logo" src="/ai-crypto-trader.png" alt="" />
      <span>AI Crypto Trader <small>· C4C</small></span>
    </a>
  </header>
  <main class="login-main">
    <section class="login-card card" aria-labelledby="login-title">
      <div class="login-eyebrow">SECURE EMAIL SIGN-IN</div>
      <h1 id="login-title">Sign in or create an account</h1>
      <p id="login-intro" class="muted login-intro">Enter your email and we’ll send a six-digit verification code.</p>
      <div class="login-progress" aria-label="Sign-in progress">
        <span id="step-one" class="current">1</span><i></i><span id="step-two">2</span>
      </div>
      <form id="email-form" class="login-step" novalidate>
        <label for="email-address">Email</label>
        <input id="email-address" name="email" type="email" autocomplete="email" maxlength="254" required />
       <!-- Cloudflare Turnstile CAPTCHA -->
     <div
      class="cf-turnstile"
       data-sitekey="0x4AAAAAAFaA7kJaQr3AQBGg">
    </div>
        <button class="btn primary login-next" type="submit">Send OTP</button>
      </form>
      <form id="code-form" class="login-step" hidden novalidate>
        <p class="login-step-label">We sent a verification code to <b id="email-summary"></b></p>
        <label for="email-code">Verification code</label>
        <input id="email-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required />
        <div class="login-buttons">
          <button id="back-to-email" class="btn" type="button">Back</button>
          <button id="verify-code" class="btn primary" type="submit">Verify</button>
        </div>
        <button id="resend-code" class="link-button" type="button">Resend code</button>
      </form>
      <div id="login-message" class="login-message" role="status" aria-live="polite" hidden></div>
      <p class="login-footnote">Codes expire according to your Supabase Auth settings. Never share a verification code.</p>
    </section>
  </main>
<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer>
</script>
<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer>
</script>
</body>
</html>
